name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Installer la clé de signature fixe
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEY_PART_1 }}${{ secrets.KEY_PART_2 }}" | base64 -d -i > ~/.android/debug.keystore

      - name: Compiler l'APK
        run: gradle assembleDebug

      - name: Sauvegarder l'APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-apk
          path: app/build/outputs/apk/debug/app-debug.apk
